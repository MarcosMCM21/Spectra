packages:
  - "apps/*"
  - "packages/*"
  - "addons/*"

# Dependências autorizadas a executar scripts de build pós-instalação
# (native addon do SQLite, binário do Electron, esbuild do tsx/Vite e o
# binding nativo do rolldown usado pelo Vite 8).
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  "@rolldown/binding-win32-x64-msvc": true
